<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Marketplace — Legal</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#6c6c70;--accent:#3e9b2e;--sep:#c6c6c8}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--accent:#6ec959;--sep:#38383a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
nav{display:flex;gap:16px;margin-bottom:16px;font-size:15px}
a{color:var(--accent)}
article{background:var(--card);border-radius:22px;padding:8px 28px 28px;border:.5px solid var(--sep)}
h1{font-size:2rem;line-height:1.15;margin:.9em 0 .4em}
h2{font-size:1.2rem;margin:1.6em 0 .3em}
p,li{margin:.5em 0}
blockquote{margin:1em 0;padding:.6em 1em;border-left:3px solid var(--accent);background:var(--bg);border-radius:8px;color:var(--muted)}
em{color:var(--muted)}
</style>
</head>
<body>
<main>
<nav><a href="https://nthakur30.github.io/tennis-marketplace-legal/terms">Terms of Use</a><a href="https://nthakur30.github.io/tennis-marketplace-legal/privacy">Privacy Policy</a></nav>
<article>
<h1>Tennis Marketplace</h1>
<p><a href="https://nthakur30.github.io/tennis-marketplace-legal/terms">Terms of Use</a></p>
<p><a href="https://nthakur30.github.io/tennis-marketplace-legal/privacy">Privacy Policy</a></p>
</article>
</main>
</body>
</html>
